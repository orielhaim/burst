services:
  postgres:
    image: postgres:17-alpine
    container_name: burst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: burst
      POSTGRES_PASSWORD: burst
      POSTGRES_DB: burst
    ports:
      - "5432:5432"
    volumes:
      - burst-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burst -d burst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  burst-postgres-data:
